services:
  - type: server
    name: udyoga
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn udhyoga.wsgi:application --bind 0.0.0.0:8000"
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: udyoga.settings
      - key: PYTHON_VERSION
        value: 3.12.0
